services:
  # FastAPI REST API Backend Web Service
  - type: web
    name: digital-twin-fastapi-backend
    env: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: sh -c "uvicorn app.api.main:app --host 0.0.0.0 --port ${PORT:-8000}"
    plan: free
    region: oregon
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false

  # Streamlit Clinical UI Dashboard Web Service
  - type: web
    name: digital-twin-streamlit-dashboard
    env: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: sh -c "streamlit run streamlit_app.py --server.port=${PORT:-8501} --server.address=0.0.0.0"
    plan: free
    region: oregon
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false

