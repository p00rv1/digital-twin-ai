version: '3.8'

services:
  # =====================================================
  # FastAPI REST API Backend Service (Port 8000)
  # =====================================================
  fastapi-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: digital_twin_fastapi
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:poorvi@host.docker.internal:5434/health_twin}
      - HOST=0.0.0.0
      - PORT=8000
    restart: unless-stopped

  # =====================================================
  # Streamlit Clinical Dashboard Frontend (Port 8501)
  # =====================================================
  streamlit-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: digital_twin_streamlit
    command: streamlit run streamlit_app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:poorvi@host.docker.internal:5434/health_twin}
    depends_on:
      - fastapi-backend
    restart: unless-stopped
